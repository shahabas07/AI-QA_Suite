name: Ping Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - main  # Change to 'master' if Repo 1's default branch is master

jobs:
  ping:
    # Only run if the PR was actually merged
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Trigger Pong Workflow in Nex-Agentic-Supply-Chain-Intelligence-Platform
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/shahabas07/Nex-Agentic-Supply-Chain-Intelligence-Platform/actions/workflows/pong.yml/dispatches \
            -f ref='main'
